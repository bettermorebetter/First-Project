<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat/Dog Face Classifier</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to the main stylesheet -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6007058588456872"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="main-content-wrapper">
        <div class="container classifier-container">
            <h1>Cat or Dog Face Classifier</h1>
            <p>Upload an image to see if it's a cat or a dog!</p>
            
            <input type="file" id="imageUpload" accept="image/*">
            <img id="uploadedImage" src="#" alt="Uploaded Image" style="display: none; max-width: 100%; max-height: 300px; margin-top: 20px;">
            
            <div id="predictionResult">
                <p>Prediction: <span id="classLabel"></span></p>
                <p>Confidence: <span id="confidence"></span></p>
            </div>

            <!-- AdSense Ad Unit -->
            <div class="adsense-unit">
                <p>(AdSense Ad Here - configure with your actual ad unit code)</p>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6007058588456872"
                     data-ad-slot="YOUR_AD_SLOT_ID"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

            <p class="model-disclaimer">Model powered by Google Teachable Machine. Please replace the script source with your actual model URL.</p>
        </div>
    </div>

    <!-- Teachable Machine model script (replace with your actual model URL) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script src="predict.js" type="module"></script>
</body>
</html>
